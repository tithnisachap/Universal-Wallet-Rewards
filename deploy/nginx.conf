# Universal Wallet Rewards — Nginx site config for the app droplet.
#
# Assumes: Cloudflare sits in front (terminating TLS at the edge), so this
# listens on plain HTTP 80. If you're not using Cloudflare, add a 443 server
# block with certbot-issued certs instead and redirect 80 -> 443.
#
# Install: copy to /etc/nginx/sites-available/wallet-rewards, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx`.

# Rate limiting zone: keyed by client IP, 10MB of state (~160k tracked IPs),
# capped at 10 requests/second per IP. This is what actually protects
# PHP-FPM and Postgres from a sudden burst of traffic — excess requests get
# an immediate 429 instead of queueing up and taking the whole app down.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.com; # or your sslip.io hostname

    root /var/www/wallet-rewards/public;
    index index.php;

    client_max_body_size 10m; # matches the app's 5MB logo/photo upload cap with headroom

    access_log /var/log/nginx/wallet-rewards.access.log;
    error_log  /var/log/nginx/wallet-rewards.error.log;

    # Built React assets (resources/js -> public/build via Vite) — served
    # directly by Nginx, never touching PHP-FPM, and safe to cache hard
    # since Vite fingerprints every filename.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vendor logos / branch photos (Storage::disk('public')).
    location /storage/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Rate-limited API surface. `burst=20 nodelay` allows short bursts
    # (e.g. a page loading several endpoints at once) without penalizing
    # normal users, while still capping sustained abuse at 10r/s per IP.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # Everything else: the SPA shell (React Router handles client-side
    # routing, so any non-file path falls back to index.php -> Blade view).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Adjust the socket path to match your PHP-FPM pool config.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
